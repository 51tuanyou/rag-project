[project]
name = "rag-backend"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "albert", email = "liu"},
]
dependencies = [
    "django>=5.2.7",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=4.6.0",
    "psycopg2-binary>=2.9.9",
    "langfuse>=2.46.0",
    "django-filter>=24.2",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.1",
    "pandas>=2.0.0",
    "pycryptodome>=3.23.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = "(migrations)"

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = [
    "E", "F", "W",  # pycodestyle & pyflakes
    "I",              # isort
    "UP",             # pyupgrade
]
lint.ignore = [
]
lint.fixable = ["ALL"]
exclude = ["migrations"]
