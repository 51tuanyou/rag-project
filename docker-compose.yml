services:
  backend:
    build:
      context: ./rag-backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_temp:/app/temp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - pgvector_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/llm/providers/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./rag-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-same-origin}
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_temp:

networks:
  # Shared named network with docker-compose.postgres.yml (postgres-ctr)
  pgvector_net:
    external: true
    name: rag_pgvector_net
