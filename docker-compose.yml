services:
  backend:
    build:
      context: ./rag-backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://llm.paoditu.com}
      DINGTALK_DEFAULT_LLM: ${DINGTALK_DEFAULT_LLM:-}
      DINGTALK_BRIDGE_TOKEN: ${DINGTALK_BRIDGE_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_temp:/app/temp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - pgvector_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/llm/providers/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  dingtalk-bridge:
    build:
      context: ./dingtalk-bridge
      dockerfile: Dockerfile
    container_name: dingtalk-bridge
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      RAG_API_BASE: http://backend:8000
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      DINGTALK_BRIDGE_TOKEN: ${DINGTALK_BRIDGE_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://llm.paoditu.com}
    ports:
      - "${DINGTALK_BRIDGE_PORT:-8010}:8010"
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./rag-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-same-origin}
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy
      dingtalk-bridge:
        condition: service_healthy

volumes:
  backend_temp:

networks:
  # Shared named network with docker-compose.postgres.yml (postgres-ctr)
  pgvector_net:
    external: true
    name: rag_pgvector_net
